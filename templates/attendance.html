<!DOCTYPE html>
<html>

<head>

    <title>Attendance Records</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#eef2f7;
        }

        .container{

            width:95%;
            margin:40px auto;

        }

        h1{

            text-align:center;
            color:#0d6efd;
            margin-bottom:25px;

        }

        .search{

            text-align:center;
            margin-bottom:25px;

        }

        input{

            width:300px;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;

        }

        button{

            padding:12px 20px;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            color:white;
            margin-left:8px;

        }

        .search-btn{

            background:#0d6efd;

        }

        .download-btn{

            background:#198754;

        }

        .home-btn{

            background:#343a40;

        }

        table{

            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0px 5px 15px rgba(0,0,0,.2);

        }

        th{

            background:#0d6efd;
            color:white;
            padding:15px;

        }

        td{

            padding:12px;
            text-align:center;
            border-bottom:1px solid #ddd;

        }

        tr:hover{

            background:#f2f2f2;

        }

        .buttons{

            margin-top:30px;
            text-align:center;

        }

    </style>

</head>

<body>

<div class="container">

<h1>Attendance Records</h1>

<div class="search">

<form method="GET">

<input
type="text"
name="search"
placeholder="Search by ID, Name or Date"
value="{{ search }}">

<button
class="search-btn"
type="submit">

Search

</button>

</form>

</div>

<table>

<tr>

<th>Student ID</th>
<th>Student Name</th>
<th>Date</th>
<th>Time</th>

</tr>

{% for row in records %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>

</tr>

{% endfor %}

</table>

<div class="buttons">

<a href="/download">

<button class="download-btn">

Download CSV

</button>

</a>

<a href="/">

<button class="home-btn">

Back to Dashboard

</button>

</a>

</div>

</div>

</body>

</html>
